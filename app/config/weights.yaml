# Scoring weight configuration for practitioner ranking.
# All weights should sum to 1.0.
# Adjust these to change ranking behavior without code changes.
#
# Priority order (highest to lowest):
#   1. Access / Existence (data completeness)
#   2. Accessibility (distance + telehealth)
#   3. Contact availability (phone, website)
#   4. Review quality (rating + review_count)
#   5. Preference / Avoidance alignment
#   6. Care style alignment
#   7. Symptom alignment
#   8. Outcome alignment

scoring_weights:
  data_completeness: 0.20
  accessibility: 0.20
  contact_availability: 0.18
  review_quality: 0.15
  preference_alignment: 0.10
  care_style_alignment: 0.07
  symptom_alignment: 0.05
  outcome_alignment: 0.05

# Thresholds and knobs
npi_match_threshold: 0.75
max_place_detail_calls: 10
max_search_queries: 4
geocode_cache_ttl_seconds: 86400
places_cache_ttl_seconds: 3600
upstream_timeout_seconds: 8
