name: Sage engine CI

on:
  pull_request:
    paths: ["sage-engine/**", ".github/workflows/sage-engine-ci.yml"]
  push:
    paths: ["sage-engine/**", ".github/workflows/sage-engine-ci.yml"]

defaults:
  run:
    working-directory: sage-engine

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sage-engine/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
